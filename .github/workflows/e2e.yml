name: Supabase E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deskwise-supabase-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_ADMIN_SETUP_SECRET: ${{ secrets.E2E_ADMIN_SETUP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm Supabase E2E secrets
        run: |
          for secret_name in E2E_SUPABASE_URL E2E_SUPABASE_PUBLISHABLE_KEY E2E_SUPABASE_SERVICE_ROLE_KEY E2E_ADMIN_SETUP_SECRET; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing repository secret: ${secret_name}"
              exit 1
            fi
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
